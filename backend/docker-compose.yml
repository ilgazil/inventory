# MariaDB 10.6 locale pour le développement (mêmes identifiants que backend/.env.example).
services:
  mariadb:
    image: mariadb:10.6
    container_name: inventory-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: inventory
      MARIADB_USER: inventory
      MARIADB_PASSWORD: inventory
    ports:
      # Port hôte 33060 pour ne pas entrer en conflit avec un MySQL/MariaDB local.
      - "33060:3306"
    volumes:
      - inventory-mariadb-data:/var/lib/mysql

volumes:
  inventory-mariadb-data:
